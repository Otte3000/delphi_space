title: "DIVIA Award 2023"
titleI18n: {}
subtitle:
  de: "Diversity in Architecture"
kind: "group-exhibition"
artistsText: "Der internationale Divia Award von Diversity in Architecture e.V. hat zum Ziel, die Sichtbarkeit von Frauen in der Architektur zu fördern. Der Preis wurde 2023 erstmals vergeben. Eine hochkarätige internationale Jury wählte unter 27 Nominierten fünf Finalistinnen aus: May al-Ibrashy (Ägypten), Katherine Clarke & Liza Fior (Vereinigtes Königreich), Noella Nibakuze (Ruanda) und Tosin Oshinowo (Nigeria). Gewinnerin ist die italienische Architektin Marta Maccaglia, die in Peru arbeitet und sich für den Bildungsbau engagiert. Die Ausstellung des Diversity in Architecture e.V., die alle fünf Finalistinnen präsentiert, wird vom 6. bis 14. Juli im DELPHI_space zu sehen sein."
