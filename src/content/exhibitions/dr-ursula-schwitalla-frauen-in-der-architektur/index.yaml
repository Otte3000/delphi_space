title: "Dr. Ursula Schwitalla: \"Frauen in der Architektur\""
titleI18n: {}
subtitle: {}
kind: "exhibition"
artistsText: "URSULA SCHWITALLA, Kunsthistorikerin kuratiert als Vorsitzende der Tübinger Kunstgeschichtlichen Gesellschaft e.V., Lehrbeauftragte und außerordentliches Mitglied des BDA seit 30 Jahren die Vortragsreihe \"Architektur Heute\" an der Universität Tübingen - unter anderem zu dem Thema „Women in Architecture“. Aus dieser Vortragsreihe entstand die Publikation Frauen in der Architektur. Sie beschreibt was es heißt, sich als Architektin fortwährend gegen Vorurteile und frauenfeindliche Strukturen behaupten zu müssen. Ein Manifest für großartige Architektinnen und die oft fehlende Anerkennung Ihrer Werke. Mit dem 2021 gegründeten Verein „Diversity in Architecture“ soll die Sichtbarkeit von Frauen in der Architektur gestärkt und die Synergien unter ihnen forciert werden. Ziel ist es, das Gleichgewicht zwischen ausgezeichneten Architektinnen und Architekten aktiv zu unterstützen und Vorbilder für die jüngere Generation der Architektinnen zu würdigen. Frauen waren lange nicht sichtbar in der Welt der Architektur. Zeit, dass sich das ändert!"
