introDe: DELPHI_space ist ein Kunst-, Kultur- und Informationszentrum in Freiburg, das seit 2019 Ausstellungen und Veranstaltungen organisiert. Wir verbinden Disziplinen, schaffen Dialoge und bieten eine Plattform für vielfältige künstlerische Stimmen. Als gemeinnützige Organisation engagieren wir uns für Gemeinschaft und Innovation in der Kunst.
introEn: DELPHI_space is an art, culture, and information center in Freiburg that has been organizing exhibitions and events since 2019. We connect disciplines, foster dialogue, and provide a platform for diverse artistic voices. As a non-profit organization, we are committed to community and innovation in the arts.
