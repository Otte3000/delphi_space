intro:
  de: >-
    DELPHI_space 2026 ist ein Kunst-, Kultur- und Informationszentrum in
    Freiburg, das seit 2019 Ausstellungen und Veranstaltungen organisiert. Wir
    verbinden Disziplinen, schaffen Dialoge und bieten eine Plattform für
    vielfältige künstlerische Stimmen. Als gemeinnützige Organisation engagieren
    wir uns für Gemeinschaft und Innovation in der Kunst.
  en: >-
    DELPHI_space is an art, culture, and information center in Freiburg that has
    been organizing exhibitions and events since 2019. We connect disciplines,
    foster dialogue, and provide a platform for diverse artistic voices. As a
    non-profit organization, we are committed to community and innovation in the
    arts.
  fr: >-
    DELPHI_space est un centre d'art, de culture et d'information à
    Fribourg-en-Brisgau qui organise des expositions et des événements depuis
    2019. Nous relions les disciplines, favorisons le dialogue et offrons une
    plateforme à des voix artistiques diverses. En tant qu'organisation à but
    non lucratif, nous nous engageons pour la communauté et l'innovation dans
    les arts.
memberTitle:
  de: Jetzt Mitglied werden!
  en: Become a member!
  fr: Devenez membre !
memberText:
  de: Werde Teil von DELPHI_space. Als Mitglied unterstützt du unser gemeinnütziges Programm, bekommst Einblicke hinter die Kulissen und bist mittendrin in der Freiburger Kunstszene.
  en: Become part of DELPHI_space. As a member you support our non-profit programme, get a look behind the scenes and are right in the middle of Freiburg's art scene.
  fr: Rejoignez DELPHI_space. En tant que membre, vous soutenez notre programme à but non lucratif, découvrez les coulisses et êtes au cœur de la scène artistique de Fribourg.
